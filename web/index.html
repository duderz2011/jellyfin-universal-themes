<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jellyfin Genre Browser</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#eee;background:#111217}body{max-width:1250px;margin:0 auto;padding:24px}h1{margin-bottom:8px}p,small{color:#afb1bc}header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}input,select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #444;background:#242530;color:#fff}input{min-width:180px}button{cursor:pointer;background:#4a4b65}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px}.card{background:#242530;border-radius:12px;overflow:hidden;text-decoration:none;color:inherit}.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#30313d}.card strong{display:block;padding:8px}.card small{display:block;padding:0 8px 8px}.error{color:#ff8c8c}#status{margin:10px 0}
</style></head><body>
<header><div><h1>Jellyfin Genre Browser</h1><p>Browse films and TV programmes by metadata — without touching your media folders.</p></div></header>
<section class="filters"><input id="server" placeholder="Jellyfin URL (e.g. http://localhost:8096)" aria-label="Server URL"><input id="token" type="password" placeholder="Your Jellyfin access token" aria-label="Access token"><button id="connect">Connect</button></section>
<section class="filters" id="browse" hidden><select id="genre"><option value="">All genres</option></select><select id="type"><option value="Movie,Series">Movies + TV</option><option value="Movie">Movies</option><option value="Series">TV shows</option></select><input id="search" placeholder="Search titles"><button id="refresh">Search</button></section>
<div id="status" role="status">Enter your server URL and personal access token. Use only on a trusted local or HTTPS page.</div><div id="results" class="grid"></div>
<script src="app.js"></script></body></html>
