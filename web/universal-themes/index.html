<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal Themes | Jellyfin</title><link rel="stylesheet" href="styles.css"></head><body data-theme="netflix-style"><div id="login" class="login"><form id="loginForm"><h1>Universal Themes</h1><p>Sign in to your Jellyfin server to browse your own accessible library.</p><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button>Sign in</button><p id="loginStatus" role="status"></p></form></div><div id="app" hidden><header><a class="brand" href="#">UNIVERSAL <span>THEMES</span></a><nav><button data-section="all" class="selected">Home</button><button data-section="Movie">Movies</button><button data-section="Series">TV Shows</button></nav><label class="search">Search <input id="search" placeholder="Search titles" autocomplete="off"></label><select id="theme" aria-label="Theme"><option value="netflix-style">Netflix style</option><option value="prime-style">Prime style</option><option value="disney-style">Disney+ style</option></select><button id="signout">Sign out</button></header><main><section id="hero" class="hero" aria-label="Featured content"><div class="hero-content"><span class="kicker">YOUR LIBRARY</span><h1 id="heroTitle">Browse your movies and shows</h1><p id="heroDescription"></p><button id="heroOpen" hidden>View details</button></div></section><p id="status" role="status"></p><div id="rows"></div><div class="bottom"><button id="more" hidden>Show more</button></div></main></div><script defer src="app.js"></script></body></html>
